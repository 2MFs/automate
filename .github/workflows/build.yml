name: Build & Release

# Triggers:
#   1. Push a tag like v1.0.0  →  full Win/Mac/Linux build + GitHub Release
#   2. Manual: Actions → Run workflow → version (creates the tag for you)

on:
  push:
    tags:
      - "v*"
    branches:
      # Push a branch named release-vX.Y.Z to trigger a release. The workflow
      # creates the tag, builds, publishes, and deletes the branch on success.
      # Useful when your tooling can push branches but not tags.
      - "release-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "version, e.g. 1.0.0 (workflow creates the tag and runs)"
        required: true

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              raw="${INPUT_VERSION#v}"
              tag="v${raw}"
              ;;
            push)
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                tag="${GITHUB_REF_NAME}"
              elif [[ "$GITHUB_REF_NAME" == release-v* ]]; then
                tag="${GITHUB_REF_NAME#release-}"
              else
                echo "unsupported ref: $GITHUB_REF" >&2; exit 1
              fi
              ;;
            *) echo "unsupported event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac

          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag"
            git push origin "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "trigger_branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  build:
    name: Build · ${{ matrix.name }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            ext: zip
          - os: macos-latest
            name: macos-arm64
            ext: zip
          - os: ubuntu-22.04
            name: linux-x64
            ext: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install autoMate (server + mcp)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[mcp]'
          pip install pyinstaller>=6.0

      - name: Build with PyInstaller
        run: pyinstaller packaging/automate.spec --noconfirm

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\automate -DestinationPath autoMate-${{ matrix.name }}.${{ matrix.ext }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -r ../autoMate-${{ matrix.name }}.${{ matrix.ext }} automate
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf autoMate-${{ matrix.name }}.${{ matrix.ext }} -C dist automate

      - uses: actions/upload-artifact@v4
        with:
          name: autoMate-${{ matrix.name }}
          path: autoMate-${{ matrix.name }}.${{ matrix.ext }}
          retention-days: 7

  extension:
    name: Pack browser extension
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r autoMate-extension.zip extension
      - uses: actions/upload-artifact@v4
        with:
          name: autoMate-extension
          path: autoMate-extension.zip

  pages:
    # Publishes the SPA to GitHub Pages so the Android TWA APK has a public
    # HTTPS origin to wrap. Best-effort: if Pages can't be enabled (org
    # restrictions, missing permission), the workflow continues and the
    # release ships without an APK / Pages URL.
    name: Deploy PWA to GitHub Pages
    needs: resolve
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage PWA + asset links
        run: |
          mkdir -p site/.well-known
          cp -r automate/frontend/* site/
          cp site/index.html site/404.html
          cat > site/.well-known/assetlinks.json <<'EOF'
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "dev.automate.hub",
              "sha256_cert_fingerprints": ["PLACEHOLDER"]
            }
          }]
          EOF
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true        # auto-enable Pages on first run
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    # Best-effort APK that wraps the GitHub Pages PWA. The TWA opens the
    # hosted UI; the user then sets their hub URL in-app (Help → Connect
    # this UI to a different hub).
    name: Build Android APK (TWA)
    needs: [resolve, pages]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli@latest
      - name: Wait briefly for Pages to propagate
        run: sleep 30
      - name: Init + build TWA
        run: |
          mkdir twa && cd twa
          MANIFEST_URL="https://${{ github.repository_owner }}.github.io/autoMate/manifest.webmanifest"
          # Bubblewrap can read manifest from URL; --skipPwaValidation lets
          # it proceed even if assetlinks isn't yet configured.
          npx -y @bubblewrap/cli init \
            --manifest "$MANIFEST_URL" \
            --directory . \
            --skipPwaValidation || exit 0
          # Sign with auto-generated keystore; non-interactive password.
          export PWA_KEY_PASSWORD=automatehub
          export PWA_KEYSTORE_PASSWORD=automatehub
          npx -y @bubblewrap/cli build --skipPwaValidation || exit 0
          ls -la
      - name: Locate APK
        id: locate
        run: |
          apk=$(find twa -name '*-release-signed.apk' -o -name '*.apk' | head -1)
          if [ -n "$apk" ]; then
            cp "$apk" autoMate-android.apk
            echo "found=true" >> "$GITHUB_OUTPUT"
            ls -lh autoMate-android.apk
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "(no APK produced — will not block release)"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.locate.outputs.found == 'true'
        with:
          name: autoMate-android
          path: autoMate-android.apk

  wheel:
    name: Build wheel + sdist
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: autoMate-pypi
          path: dist/*

  release:
    name: Publish Release
    # Hard deps: only the things that should always succeed. Pages and
    # android are best-effort — the release publishes whatever subset of
    # artifacts exists.
    needs: [resolve, build, extension, wheel]
    if: always() && needs.resolve.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Allow missing artifacts (no APK, etc.) without failing.
        continue-on-error: true
      - name: List artifacts
        run: find artifacts -type f -printf '%p  (%s bytes)\n' || true
      - uses: softprops/action-gh-release@v2
        with:
          name: "autoMate ${{ needs.resolve.outputs.tag }}"
          tag_name: ${{ needs.resolve.outputs.tag }}
          fail_on_unmatched_files: false
          files: |
            artifacts/autoMate-windows-x64/autoMate-windows-x64.zip
            artifacts/autoMate-macos-arm64/autoMate-macos-arm64.zip
            artifacts/autoMate-linux-x64/autoMate-linux-x64.tar.gz
            artifacts/autoMate-extension/autoMate-extension.zip
            artifacts/autoMate-pypi/*.whl
            artifacts/autoMate-pypi/*.tar.gz
            artifacts/autoMate-android/autoMate-android.apk
          generate_release_notes: true
          body: |
            ## Install

            **Standalone binaries — no Python required**

            | OS | file |
            |----|------|
            | Windows x64 | `autoMate-windows-x64.zip` |
            | macOS Apple Silicon | `autoMate-macos-arm64.zip` |
            | Linux x64 | `autoMate-linux-x64.tar.gz` |

            Unzip and run `./automate/automate serve`. The browser opens to
            `http://127.0.0.1:8765`.

            **pip**

            ```bash
            pip install 'automate-hub[full]'
            automate serve
            ```

            **Docker**

            ```bash
            docker run --rm -p 8765:8765 -v automate-data:/data \
              ghcr.io/yuruotong1/automate:latest
            ```

            **Browser extension** — `autoMate-extension.zip`. Unzip, then
            `chrome://extensions` → Developer mode → Load unpacked → pick the
            folder. The toolbar badge flips to **ON** when paired.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete trigger branch (if any)
        if: startsWith(needs.resolve.outputs.trigger_branch, 'release-v')
        run: |
          git push origin --delete "${{ needs.resolve.outputs.trigger_branch }}" || true
